# Project-scoped Codex configuration.
#
# The parent session may use the explicit GPT-5.6 Sol model ID.
# Project subagents use the Codex-supported GPT-5.6 alias,
# which routes to GPT-5.6 Sol.

[agents]
enabled = true
max_concurrent_threads_per_session = 4

# # Use GPT-5.6 Sol for project subagents through the Codex-supported alias.
# default_subagent_model = "gpt-5.6"

